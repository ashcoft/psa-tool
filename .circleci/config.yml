version: 2.1

jobs:
  build-and-test:
    docker:
      - image: cimg/node:26.13
    steps:
      - checkout
      - restore_cache:
          keys:
            - v1-deps-{{ checksum "package-lock.json" }}
            - v1-deps-
      - run:
          name: Install dependencies
          command: npm ci
      - save_cache:
          key: v1-deps-{{ checksum "package-lock.json" }}
          paths:
            - node_modules
      - run:
          name: Lint
          command: npm run lint
      - run:
          name: Type check
          command: npx tsc --noEmit
      - run:
          name: Unit tests
          command: npm run test:run
      - run:
          name: Build
          command: npm run build

workflows:
  ci:
    jobs:
      - build-and-test
