name: API

on:
  push:
    branches: ['**']
    paths:
      - 'services/**'
      - '.github/workflows/api.yml'
  pull_request:
    branches: ['**']
    paths:
      - 'services/**'
      - '.github/workflows/api.yml'

jobs:
  test:
    name: Server tier
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: psa
          POSTGRES_PASSWORD: psa
          POSTGRES_DB: psa_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U psa -d psa_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PSA_TEST_DATABASE_URL: postgresql+psycopg://psa:psa@localhost:5432/psa_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            services/api/requirements-dev.lock
            services/api/requirements.lock

      - name: Install dependencies
        working-directory: services/api
        run: >-
          pip install --only-binary :all: --require-hashes --no-deps -r requirements-dev.lock

      - name: Lint
        working-directory: services/api
        run: python -m ruff check .

      - name: Unit, contract, parity and PostgreSQL tests
        working-directory: services/api
        run: python -m pytest

      - name: Build the container image
        run: docker build -t psa-api:ci services/api
